<section>
  <div class="container-fluid py-4">
    <div class="padding-x">
      <div class="site-inner users-page">

        <!-- HEADER -->
        <div class="page-header-section">
          <h2 class="page-title">Quản lý tài khoản</h2>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
          <div class="search-wrapper">
            <div class="search-container">
              <i class="bi bi-search search-icon"></i>
              <input type="text"
                     class="search-input"
                     placeholder="Tìm kiếm"
                     [(ngModel)]="searchTerm"
                (input)="onSearchInput($event)" />
            </div>
          </div>

          <div class="filter-group">
            <button class="filter-btn" (click)="toggleSort('a-z')" [class.active]="sortMode==='a-z' || sortMode==='za'">
              <i class="bi" [ngClass]="sortMode==='a-z' ? 'bi-arrow-down' : (sortMode==='za' ? 'bi-arrow-up' : 'bi-arrow-down')"></i>
              A-Z
            </button>
            <button class="filter-btn" [class.active]="sortMode === 'newest'" (click)="setSortMode('newest')">Mới nhất</button>
            <button class="filter-btn" [class.active]="sortMode === 'oldest'" (click)="setSortMode('oldest')">Cũ nhất</button>

            <div class="dropdown-wrapper">
              <div class="dropdown-selected" (click)="toggleDropdown($event)">
                {{ statusFilterLabel }}
                <i class="bi bi-chevron-down dropdown-icon" [class.rotate]="dropdownOpen"></i>
              </div>
              <div class="dropdown-menu" *ngIf="dropdownOpen">
                <div class="dropdown-item" (click)="selectStatus('all', 'Tất cả trạng thái', $event)">Tất cả trạng thái</div>
                <div class="dropdown-item" (click)="selectStatus('active', 'Hoạt động', $event)">Hoạt động</div>
                <div class="dropdown-item" (click)="selectStatus('inactive', 'Không hoạt động', $event)">Không hoạt động</div>
              </div>
            </div>
          </div>
        </div>

        <!-- USER CARDS -->
        <div class="users-container">
          <div class="user-card" *ngFor="let user of pagedUsers">
            <div class="user-info">
              <h3 class="user-name">{{ user.Ho_va_ten }}</h3>
              <p class="user-detail"><strong>Mã khách hàng:</strong> {{ user.Ma_khach_hang }}</p>
              <p class="user-detail"><strong>Số điện thoại:</strong> {{ user.So_dien_thoai }}</p>
              <p class="user-detail"><strong>Email:</strong> {{ user.Email }}</p>
            </div>
            <div class="user-actions">
              <button class="action-btn view-btn" (click)="openUserForm(user)">👁 Xem chi tiết</button>
              <button class="action-btn disable-btn" (click)="requestToggleUserStatus(user)">
                <i class="bi" [ngClass]="user.Trang_thai ? 'bi-slash-circle' : 'bi-arrow-counterclockwise'"></i>
                {{ user.Trang_thai ? 'Vô hiệu hóa' : 'Khôi phục tài khoản' }}
              </button>
            </div>
          </div>
        </div>

        <!-- PAGINATION -->
        <div class="pagination">
          <button class="pagination-btn" (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
          <button *ngFor="let page of pages"
                  class="pagination-btn"
                  (click)="goToPage(page)"
                  [class.active]="page === currentPage">
            {{ page }}
          </button>
          <button class="pagination-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
        </div>

      </div>
    </div>
  </div>

  <!-- USER FORM MODAL -->
  <app-modal
    modalId="userFormModal"
    [title]="'Mã khách hàng: ' + selectedUser?.Ma_khach_hang"
    (close)="closeUserFormModal()"
    *ngIf="showUserForm">
    <app-user-form
      [selectedUser]="selectedUser"
      (cancel)="closeUserFormModal()"
      (disable)="selectedUser && requestToggleUserStatus(selectedUser)">
    </app-user-form>
  </app-modal>

  <app-confirm-dialog
    *ngIf="showStatusConfirm"
    modalId="userStatusConfirmModal"
    [title]="confirmTitle"
    [message]="confirmMessage"
    (confirm)="confirmToggleUserStatus()"
    (cancel)="cancelToggleUserStatus()">
  </app-confirm-dialog>
</section>
