<section>
  <div class="container-fluid py-2">
    <div class="px-0">
      <div class="site-inner">

        <div class="promotion-container">

          <form class="promotion-form">

            <!-- Mã khuyến mãi -->
            <div class="form-group full">
              <label>Mã khuyến mãi <span>*</span></label>
              <input type="text" name="promotionCode" [(ngModel)]="formValue.promotionCode" [readonly]="isEditMode" />
            </div>

            <!-- Mã số -->
            <div class="form-group">
              <label>Mã số <span>*</span></label>
              <input type="text" name="code" [(ngModel)]="formValue.code" />
            </div>

            <!-- Phần trăm giảm -->
            <div class="form-group">
              <label>Phần trăm giảm <span>*</span></label>
              <input type="number" name="discountPercent" [(ngModel)]="formValue.discountPercent" />
            </div>

            <!-- Ngày bắt đầu -->
            <div class="form-group">
              <label>Ngày bắt đầu <span>*</span></label>
              <input type="date" name="startDate" [(ngModel)]="formValue.startDate" />
            </div>

            <!-- Ngày kết thúc -->
            <div class="form-group">
              <label>Ngày kết thúc <span>*</span></label>
              <input type="date" name="endDate" [(ngModel)]="formValue.endDate" />
            </div>

            <!-- Phân hạng người dùng -->
            <div class="form-group">
              <label>Phân hạng người dùng <span>*</span></label>
              <select name="minimumRank" [(ngModel)]="formValue.minimumRank">
                <option value="" disabled>Chọn phân hạng</option>
                <option *ngFor="let option of rankOptions" [value]="option.value">
                  {{ option.label }}
                </option>
              </select>
            </div>

            <!-- Số lượng -->
            <div class="form-group">
              <label>Số lượng <span>*</span></label>
              <input type="number" name="remaining" [(ngModel)]="formValue.remaining" />
            </div>

            <!-- Mô tả -->
            <div class="form-group full">
              <label>Mô tả <span>*</span></label>
              <textarea rows="3" name="description" [(ngModel)]="formValue.description"></textarea>
            </div>

            <div class="form-group full status-toggle-group">
              <label>Trạng thái voucher</label>
              <button type="button" class="status-toggle-btn" [class.paused]="formValue.status === 'paused'"
                (click)="toggleVoucherStatus()" [attr.aria-pressed]="formValue.status === 'active'">
                <span class="status-toggle-track">
                  <span class="status-toggle-thumb"></span>
                </span>
                <span class="status-toggle-text">
                  {{ formValue.status === 'active' ? 'Kích hoạt' : 'Tạm dừng' }}
                </span>
              </button>
            </div>

            <div class="btn-wrapper">
              <button type="button" class="save-btn" (click)="openConfirm()">
                Lưu mã khuyến mãi
              </button>

            </div>

          </form>

        </div>

      </div>
    </div>
  </div>
</section>

<app-confirm-dialog *ngIf="showConfirm" modalId="confirmSaveModal" title="Xác nhận lưu"
  message="Bạn có chắc muốn lưu mã khuyến mãi này?" (confirm)="confirmSave()" (cancel)="closeConfirm()">
</app-confirm-dialog>
