<section>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <div class="address-page">

          <!-- HEADER -->
          <div class="address-header-top">
            <div>
              <h2 class="page-title">Địa chỉ của tôi</h2>
              <p class="page-subtitle">Quản lý địa chỉ giao hàng của bạn</p>
            </div>

            <button class="btn-brown btn-add"
              (click)="openAddAddressModal()"
              data-bs-toggle="modal"
              data-bs-target="#addAddressModal">
              <i class="bi bi-plus-circle"></i>
              Thêm địa chỉ mới
            </button>
          </div>

          <div *ngIf="isLoading" class="text-center py-4">Đang tải danh sách địa chỉ...</div>

          <div *ngIf="!isLoading && addresses.length === 0" class="text-center py-4">
            Bạn chưa có địa chỉ giao hàng nào.
          </div>

          <div
            *ngFor="let address of addresses; let i = index"
            class="address-card"
            [class.is-default]="address.isDefault">
            <div class="address-header">
              <div>
                <span class="address-title">{{ address.fullName || 'Khách hàng' }}</span>
                <span class="address-phone" *ngIf="address.phone">Số điện thoại: {{ address.phone }}</span>
              </div>

              <div class="btn-group">
                <button class="btn-brown" (click)="openEditAddress(address)" data-bs-toggle="modal" data-bs-target="#addAddressModal">Cập nhật</button>
                <button
                  class="btn-outline-brown btn-delete"
                  [disabled]="isDeletingAddress && deletingAddressIndex === address.sourceIndex"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteAddressConfirmModal"
                  title="Xóa địa chỉ"
                  aria-label="Xóa địa chỉ"
                  (click)="deleteAddress(address.sourceIndex)">
                  <span class="spinner-border spinner-border-sm" *ngIf="isDeletingAddress && deletingAddressIndex === address.sourceIndex" aria-hidden="true"></span>
                  <i class="bi bi-trash" *ngIf="!(isDeletingAddress && deletingAddressIndex === address.sourceIndex)" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="address-content">
              {{ address.address }}
            </div>

            <span *ngIf="address.isDefault" class="default-badge">Địa chỉ mặc định</span>
            <button *ngIf="!address.isDefault" class="btn-outline-brown set-default" (click)="setDefaultAddress(address)">
              Thiết lập mặc định
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>

<!-- ADD ADDRESS MODAL -->
<app-modal
  modalId="addAddressModal"
  [title]="addressModalTitle"
  [showHeader]="true"
  [showTitleAndLine]="true"
  [showCloseButton]="true">
  <app-add-address-modal
    [mode]="addressModalMode"
    [addressIndex]="editingAddressIndex"
    [initialAddress]="editingAddressData"
    (addressAdded)="onAddressSaved($event)"></app-add-address-modal>
</app-modal>

<app-modal
  modalId="deleteAddressConfirmModal"
  title="Xác nhận xóa"
  [showHeader]="true"
  [showTitleAndLine]="true"
  [showCloseButton]="true">
  <div class="delete-confirm-content">
    <p class="delete-confirm-message">Bạn có chắc muốn xóa địa chỉ này không?</p>
    <div class="delete-confirm-actions">
      <button type="button" class="btn-brown" [disabled]="isDeletingAddress" (click)="confirmDeleteAddress()">
        <span class="spinner-border spinner-border-sm me-2" *ngIf="isDeletingAddress" aria-hidden="true"></span>
        {{ isDeletingAddress ? 'Đang xử lý...' : 'Xác nhận' }}
      </button>
    </div>
  </div>
</app-modal>

<div *ngIf="showToast" class="address-toast" [class.toast-error]="toastType === 'error'">
  {{ toastMessage }}
</div>
