<section wish-list>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <!-- Header -->
        <h2 class="page-title">Sản phẩm yêu thích</h2>

        <!-- Sort options -->
        <div class="wishlist-sort mb-3">

          <button class="sort-btn" (click)="sortByFavoriteOrder()" [class.active]="currentSort === 'date'">
            {{ dateSort === 'desc' ? 'Mới nhất' : 'Cũ nhất' }}
            <i class="bi"
              [ngClass]="dateSort === 'desc' ? 'bi-arrow-down' : 'bi-arrow-up'">
            </i>
          </button>

          <button class="sort-btn" (click)="sortByPrice()" [class.active]="currentSort === 'price'"> 
            {{ priceSort === 'desc' ? 'Giá cao' : 'Giá thấp' }}
            <i class="bi" [ngClass]="priceSort === 'desc' ? 'bi-arrow-down' : 'bi-arrow-up'"></i>
          </button>

        </div>

        <!-- Wishlist items -->
         <div class="wishlist-list">  
        <div class="wishlist-item" *ngFor="let p of products">

          <button class="heart-icon" (click)="toggleFavorite(p.Ma_san_pham)">
            <i class="bi"
              [ngClass]="isFavorite(p.Ma_san_pham) ? 'bi-heart-fill' : 'bi-heart'">
            </i>
          </button>

          <div class="thumb">
            <img [src]="productService.getImgUrl(p.Hinh_anh[0])" [alt]="p.Ten_san_pham">
          </div>

          <div class="info">
            <strong>{{ p.Ten_san_pham }}</strong>
            <p>{{ p.Chat_lieu }}</p>
            <p>{{ getFinalPrice(p) | number:'1.0-0' }} VNĐ</p>
          </div>

          <div class="actions">
            <button class="btn-cart" (click)="addToCart(p.Ma_san_pham)">
              <i class="bi bi-cart"></i>
            </button>
          </div>

          <div class="cart-notification" *ngIf="cartNotificationProductId === p.Ma_san_pham">
            <i class="bi bi-check-circle"></i> Đã thêm vào giỏ hàng
          </div>

        </div>
        </div>

      </div>
    </div>
  </div>
</section>
