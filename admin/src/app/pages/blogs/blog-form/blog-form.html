<div class="blog-detail-page" *ngIf="!isLoading && blog">
  <!-- BACK TO EDIT BUTTON -->
  <div class="back-to-edit">
    <button class="btn-back-edit" (click)="backToEdit()">
      <i class="bi bi-pencil-square"></i> Quay lại chỉnh sửa
    </button>
  </div>

  <!-- HERO SECTION -->
  <div class="blog-hero">
    <img [src]="blog.Hinh_anh" [alt]="blog.Tieu_de" class="hero-image" />
    <div class="hero-overlay"></div>
  </div>

  <!-- CONTENT SECTION -->
  <div class="container-fluid py-5">
    <div class="px-4">
      <div class="site-inner">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <!-- TITLE -->
            <h1 class="blog-title">{{ blog.Tieu_de }}</h1>

            <!-- META INFO -->
            <div class="blog-meta">
              <span class="meta-date">{{ blog.Ngay_tao | date: 'dd/MM/yyyy' }}</span>
            </div>

            <!-- BLOG CONTENT -->
            <div class="blog-content">
              <ng-container *ngFor="let item of blog.Noi_dung">
                <!-- TEXT CONTENT -->
                <p *ngIf="item.Loai === 'text'" class="content-text">{{ item.Noi_dung }}</p>

                <!-- IMAGE CONTENT -->
                <figure *ngIf="item.Loai === 'image'" class="content-image">
                  <img [src]="item.Url" [alt]="item.Mo_ta" />
                  <figcaption *ngIf="item.Mo_ta">{{ item.Mo_ta }}</figcaption>
                </figure>
              </ng-container>
            </div>

            <!-- AUTHOR SIGNATURE -->
            <div class="author-signature">
              <p>DWELLY</p>
            </div>

          
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RELATED POSTS SECTION -->

</div>
