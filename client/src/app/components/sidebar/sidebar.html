<div class="sidebar-wrapper d-flex flex-column justify-content-between">
  <!-- TOP -->
  <div>
    <!-- User info -->
    <div class="user-info">
      <div class="d-flex gap-3 align-items-start mb-3">
        <img
          [src]="userInfo?.Anh_dai_dien || 'https://i.pravatar.cc/100'"
          alt="avatar"
          class="avatar"
        />
        <div class="user-details flex-grow-1">
          <h6 class="mb-1 text-white">{{ userInfo?.Ho_va_ten }}</h6>
          <small class="text-light d-block">{{ userInfo?.Email }}</small>
          <div class="member-badge mt-2" [ngClass]="getMemberBadgeClass()">
            <i class="bi" [ngClass]="getMemberBadgeIcon()"></i>
            <span>{{ getMemberBadgeLabel() }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <ul class="menu list-unstyled mt-4">
      <li class="menu-item" routerLink="/user-layout/info" routerLinkActive="active">
        <i class="bi bi-person"></i>
        <span>Tài khoản cá nhân</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/address" routerLinkActive="active">
        <i class="bi bi-geo-alt"></i>
        <span>Địa chỉ của tôi</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/orders" [class.active]="isOrdersActive()">
        <i class="bi bi-receipt"></i>
        <span>Quản lý đơn hàng</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/returns" routerLinkActive="active">
        <i class="bi bi-arrow-repeat"></i>
        <span>Quản lý đổi trả</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/reviews" routerLinkActive="active">
        <i class="bi bi-star"></i>
        <span>Đánh giá đơn hàng</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/wishlist" routerLinkActive="active">
        <i class="bi bi-heart"></i>
        <span>Sản phẩm yêu thích</span>
      </li>
      <li class="menu-item" routerLink="/user-layout/notifications" routerLinkActive="active">
        <i class="bi bi-bell"></i>
        <span>Thông báo</span>
        <span class="badge">2</span>
      </li>
    </ul>
  </div>

  <!-- LOGOUT -->
  <div class="logout-wrapper">
    <button class="btn logout-btn w-100" type="button" (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Đăng xuất
    </button>
  </div>
</div>
