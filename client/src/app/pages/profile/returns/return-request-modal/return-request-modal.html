<!-- Product Info -->
<div *ngIf="currentProduct" class="return-product-info">
  <div class="return-product-image">
    <img
      [src]="currentProduct.product?.Hinh_anh?.[0] || 'assets/images/placeholder.png'"
      alt="product"
    />
  </div>
  <div class="return-product-text">
    <p>
      <span class="value">{{ currentProduct.product?.Ten_san_pham }}</span>
    </p>
    <p>
      <span class="value">Số lượng: {{ currentProduct.So_luong }}</span>
    </p>
    <p>
      <span class="value">{{ orderInfo?.Ma_don_mua }}</span>
    </p>
  </div>
</div>

<!-- Return Reason -->
<div class="return-reason-section">
  <label>Lý do yêu cầu trả hàng</label>
  <select 
    class="reason-select"
    [(ngModel)]="returnReason"
    (ngModelChange)="returnReasonChange.emit($event)">
    <option value="">Chọn lý do</option>
    <option value="change_mind">Đổi ý không muốn mua</option>
    <option value="defective">Sản phẩm bị lỗi</option>
    <option value="wrong_item">Không đúng mô tả</option>
    <option value="damaged">Hàng bị hư hỏng khi vận chuyển</option>
    <option value="other">Lý do khác</option>
  </select>
</div>

<!-- Add Images Section -->
<div class="return-images-section">
  <label>Thêm hình ảnh (nếu có)</label>
  <div class="images-grid">
    <div *ngFor="let i of [0, 1, 2, 3, 4]" class="image-upload-box">
      <input
        type="file"
        accept="image/*"
        (change)="onImageSelected($event, i)"
        #imageInput />
      <div class="image-preview" *ngIf="returnImages[i]" (click)="imageInput.click()">
        <img [src]="returnImages[i]" alt="preview" />
        <button type="button" class="remove-image-btn" (click)="$event.stopPropagation(); removeImage.emit(i)">
          <i class="bi bi-x"></i>
        </button>
      </div>
      <div class="upload-placeholder" *ngIf="!returnImages[i]" (click)="imageInput.click()">
        <i class="bi bi-plus"></i>
      </div>
    </div>
  </div>
</div>

<!-- Return Description -->
<div class="return-content-section">
  <label>Mô tả chi tiết</label>
  <div class="textarea-wrapper">
    <textarea
      class="return-textarea"
      [(ngModel)]="returnDescription"
      (ngModelChange)="returnDescriptionChange.emit($event)"
      maxlength="500"
      placeholder="Mô tả chi tiết về vấn đề của sản phẩm...">
    </textarea>
    <div class="char-counter">{{ returnDescription.length }}/500</div>
  </div>
</div>

<!-- Modal Footer -->
<div class="modal-footer">
  <button class="btn-cancel" (click)="cancel.emit()">Hủy</button>
  <button class="btn-submit" (click)="submit.emit()">Gửi yêu cầu</button>
</div>
