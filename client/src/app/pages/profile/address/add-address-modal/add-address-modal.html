<form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="add-address-form">

  <!-- SECTION 1: THÔNG TIN CÁ NHÂN -->
  <div class="form-section">
    <div class="section-title">
      <i class="bi bi-person"></i>
      <span>Thông tin cá nhân</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Họ và tên <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="fullName"
            placeholder="Fiona" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('fullName')?.value" (click)="clearField('fullName')"></i>
        </div>
        <small class="text-danger" *ngIf="addressForm.get('fullName')?.touched && addressForm.get('fullName')?.errors?.['required']">Vui lòng nhập họ và tên</small>
      </div>

      <div class="form-group">
        <label>Số điện thoại <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="phone"
            placeholder="0987654321" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('phone')?.value" (click)="clearField('phone')"></i>
        </div>
        <small class="text-danger" *ngIf="addressForm.get('phone')?.touched && addressForm.get('phone')?.errors?.['required']">Vui lòng nhập số điện thoại</small>
        <small class="text-danger" *ngIf="addressForm.get('phone')?.touched && addressForm.get('phone')?.errors?.['invalidPhone']">Số điện thoại không đúng định dạng</small>
        <small class="text-danger" *ngIf="addressForm.get('phone')?.touched && addressForm.get('phone')?.errors?.['weakPhonePattern']">Số điện thoại không được là dãy lặp hoặc liên tiếp</small>
      </div>
    </div>
  </div>

  <!-- SECTION 2: ĐỊA CHỈ NHẬN HÀNG -->
  <div class="form-section">
    <div class="section-title">
      <i class="bi bi-geo-alt"></i>
      <span>Địa chỉ nhận hàng</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Tỉnh/Thành phố <span class="required">*</span></label>
        <select formControlName="province" class="form-select" [disabled]="isLoadingLocations">
          <option value="">{{ isLoadingLocations ? 'Đang tải dữ liệu...' : 'Chọn Tỉnh/Thành phố' }}</option>
          <option *ngFor="let p of provinces" [value]="p.code">{{ p.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quận/Huyện <span class="required">*</span></label>
        <select formControlName="district" class="form-select" [disabled]="isLoadingLocations || districts.length === 0">
          <option value="">Chọn Quận/Huyện</option>
          <option *ngFor="let d of districts" [value]="d.code">{{ d.name }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phường/Xã <span class="required">*</span></label>
        <select formControlName="ward" class="form-select" [disabled]="isLoadingLocations || wards.length === 0">
          <option value="">Chọn Phường/Xã</option>
          <option *ngFor="let w of wards" [value]="w.code">{{ w.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Địa chỉ cụ thể <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="address"
            placeholder="222222" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('address')?.value" (click)="clearField('address')"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- CHECKBOX -->
  <div class="form-checkbox">
    <input
      type="checkbox"
      id="isDefault"
      (change)="onDefaultChange($event)"
      formControlName="isDefault" />
    <label for="isDefault">Đặt làm địa chỉ mặc định</label>
  </div>

  <!-- BUTTON -->
  <button
    type="submit"
    class="btn-submit"
    [disabled]="addressForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Đang xử lý...' : (mode === 'edit' ? 'Cập nhật địa chỉ' : 'Hoàn thành') }}
  </button>

  <div class="text-danger mt-2" *ngIf="submitError">{{ submitError }}</div>

</form>
