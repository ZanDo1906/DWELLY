<section>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <div class="account-page">

          <div class="account-card">
            <!-- TOP INFO -->
            <div class="account-top">
              <div class="user-info">
                <div class="avatar"></div>
                <div>
                  <div class="user-name">Your name</div>
                  <div class="user-email">yourname&#64;gmail.com</div>
                </div>
              </div>
            </div>

            <!-- FORM -->
            <div class="account-form">
              <div class="form-group full">
                <label>Họ tên</label>
                <input type="text" value="Your name" />
              </div>

              <div class="form-group">
                <label>Số điện thoại *</label>
                <input type="text" value="0987654321" />
              </div>

              <div class="form-group">
                <label>Email</label>
                <input type="email" value="yourname&#64;gmail.com" />
              </div>

              <div class="form-group full">
                <label>Mật khẩu *</label>
                <div class="password-field">
                  <input type="password" value="************" [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" />
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="togglePassword()"></i>
                </div>
                <a class="change-password" routerLink="/reset-password">Thay đổi mật khẩu</a>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>
</section>
