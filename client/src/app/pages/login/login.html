<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-end mb-1">
  <button
    type="button"
    class="btn-close float-end"
    (click)="onClose()">
  </button>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">

    <h3 class="text-center text-uppercase title-register">
      Đăng nhập
    </h3>

    <p class="text-center register-subtitle">
      Chào mừng bạn quay trở lại!
    </p>

    <!-- Email -->
    <div class="mb-3">
      <label>Email</label>
      <input
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="Nhập email"
        [class.is-invalid]="email.invalid && (email.touched || email.dirty)">

      <div *ngIf="email.invalid && (email.touched || email.dirty)">
        <small class="text-danger" *ngIf="email.errors?.['required']">
          Email không được để trống
        </small>
        <small class="text-danger" *ngIf="email.errors?.['email']">
          Email không hợp lệ
        </small>
      </div>
    </div>

    <!-- Mật khẩu -->
    <div class="mb-3">
      <label>Mật khẩu</label>
      <input
        type="password"
        class="form-control"
        formControlName="password"
        placeholder="Nhập mật khẩu"
        [class.is-invalid]="password.invalid && (password.touched || password.dirty)">

      <div *ngIf="password.invalid && (password.touched || password.dirty)">
        <small class="text-danger" *ngIf="password.errors?.['required']">
          Mật khẩu không được để trống
        </small>
      </div>
    </div>

    <button
      type="submit"
      class="btn btn-register w-100"
      [disabled]="loginForm.invalid">
      Đăng nhập
    </button>

  </form>

</div>
