<a [routerLink]="['/product', product.Ma_san_pham]" class="product-link">
  <div class="product-card">
  <div class="card-thumb"
       (mouseenter)="enableHover ? hover=true : null"
       (mouseleave)="enableHover ? hover=false : null">

    <img class="main-img" [src]="getMainImage()" alt="{{ product.Ten_san_pham }}">
    <img *ngIf="enableHover" class="hover-img" [src]="getHoverImage()" alt="{{ product.Ten_san_pham }}">


    <span class="discount-tag" *ngIf="getDiscountPercent() > 0 && !isOutOfStock()">
      -{{ getDiscountPercent() }}%
    </span>
    <span class="discount-tag" *ngIf="isOutOfStock()" style="background-color: #555;">
      Hết hàng
    </span>
  </div>

  <div class="card-body">
    <h3 class="product-name">{{ product.Ten_san_pham }}</h3>
    <div class="product-meta">
      <span class="new-price">{{ getFormattedPrice() }}</span>
      <span
        class="old-price"
        *ngIf="getDiscountPercent() > 0">
        {{ getOldPrice() }}
      </span>
    </div>

    <div class="rating-actions">
      <div class="rating">
        <i [class]="getStarIcon()"></i>
        <span class="rating-score">{{ averageRating | number:'1.1-1' }}</span>
      </div>
      <div class="actions">
        <i class="bi"
          [ngClass]="isFavorite(product.Ma_san_pham) ? 'bi-heart-fill' : 'bi-heart'"
          (click)="toggleFavorite($event, product.Ma_san_pham)">
        </i>
        <i class="bi"
          [ngClass]="isOutOfStock() ? 'bi-cart-x text-muted' : 'bi-cart'"
          [style.cursor]="isOutOfStock() ? 'not-allowed' : 'pointer'"
          [title]="isOutOfStock() ? 'Sản phẩm đã hết hàng' : 'Thêm vào giỏ hàng'"
          (click)="goToCart($event)">
        </i>
      </div>
    </div>
  </div>
  <div class="cart-notification" *ngIf="showCartNotification">
    <i class="bi bi-check-circle"></i> Đã thêm vào giỏ hàng
  </div>
  </div>
</a>
