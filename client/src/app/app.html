<!-- CHẠY THẬT -->
<div class="app-shell">
  <app-header></app-header>
  <div class="header-spacer" aria-hidden="true">
    <section class="py-2">
      <div class="container-fluid">
        <div class="px-4">
          <div class="site-inner">
            <img src="assets/images/logo/logo.png" alt="" height="40" class="invisible" />
          </div>
        </div>
      </div>
    </section>
  </div>
  <main class="app-main">
    <router-outlet></router-outlet>

  </main>
  <app-footer></app-footer>
</div>

<app-modal modalId="registerModal" [showHeader]="true" [showTitleAndLine]="false" [showCloseButton]="true"
  (close)="closeRegisterModal()">
  <app-register></app-register>
</app-modal>

<app-modal modalId="loginModal" (close)="closeLoginModal()" [showHeader]="true" [showTitleAndLine]="false"
  [showCloseButton]="true">
  <app-login></app-login>
</app-modal>

<app-modal modalId="forgotPasswordModal" [showHeader]="true" [showTitleAndLine]="false" [showCloseButton]="true">
  <app-forgot-password></app-forgot-password>
</app-modal>

<app-modal modalId="loginAlertModal" [showHeader]="true" [showTitleAndLine]="false" [showCloseButton]="true"
  (close)="closeLoginAlertPopup()">
  <app-login-alert-popup (closeModal)="closeLoginAlertPopup()"></app-login-alert-popup>
</app-modal>
