<section>
  <div class="container-fluid py-4">
    <div class="padding-x">
      <div class="site-inner blogs-page">

        <!-- HEADER -->
        <div class="page-header">
          <h2 class="page-title">Quản lý Blogs</h2>

          <button class="add-btn" routerLink="/blog">
            <i class="bi bi-plus-circle"></i> Thêm bài viết
          </button>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
          <div class="search-wrapper">
            <div class="search-container">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="search-input" [value]="searchTerm" (input)="onSearchInput($event)"
                placeholder="Tìm kiếm" />
            </div>
          </div>

          <div class="filter-group">
            <button class="filter-btn" (click)="toggleSort('az')" [class.active]="sortMode==='az' || sortMode==='za'">
              <i class="bi"
                [ngClass]="sortMode==='az' ? 'bi-arrow-down' : (sortMode==='za' ? 'bi-arrow-up' : 'bi-arrow-down')"></i>
              A-Z
            </button>

            <button class="filter-btn" (click)="setDateSort('newest')" [class.active]="sortMode==='newest'">Mới nhất</button>
            <button class="filter-btn" (click)="setDateSort('oldest')" [class.active]="sortMode==='oldest'">Cũ nhất</button>

            <div class="dropdown-wrapper">
              <div class="dropdown-selected" (click)="toggleDropdown($event)">
                {{ statusFilter }}
                <i class="bi bi-chevron-down dropdown-icon" [class.rotate]="dropdownOpen"></i>
              </div>
              <div class="dropdown-menu" *ngIf="dropdownOpen">
                <div class="dropdown-item" (click)="selectStatus('Tất cả trạng thái', $event)">Tất cả trạng thái</div>
                <div class="dropdown-item" (click)="selectStatus('Đã đăng', $event)">Đã đăng</div>
                <div class="dropdown-item" (click)="selectStatus('Nháp', $event)">Nháp</div>
              </div>
            </div>
            <button class="delete-btn" [disabled]="selectedCount === 0" (click)="deleteSelected()">
              <i class="bi bi-trash"></i>
            </button>

          </div>
        </div>

        <!-- TABLE -->
        <app-table>

          <!-- HEADER -->
          <ng-container table-header>
            <th>
              <input type="checkbox" class="checkbox-input" (change)="toggleSelectAll($event)"
                [checked]="isAllSelected()" />
            </th>
            <th>Mã bài viết</th>
            <th>Tiêu đề</th>
            <th>Ngày đăng</th>
            <th>Người viết</th>
            <th>Trạng thái</th>
            <th>Lượt xem</th>
            <th>Hành động</th>
          </ng-container>

          <!-- BODY -->
          <ng-container table-body>
            <tr *ngFor="let blog of pagedBlogs; let i = index">
              <td>
                <input type="checkbox" class="checkbox-input" [(ngModel)]="blog.selected"
                  (change)="onCheckboxChange()" />
              </td>
              <td>{{ blog.code }}</td>
              <td>{{ blog.title }}</td>
              <td>{{ blog.date }}</td>
              <td>{{ blog.author }}</td>
              <td>
                <span class="status" [ngClass]="blog.status">
                  {{ getStatusLabel(blog.status) }}
                </span>
              </td>
              <td>{{ blog.views }}</td>
              <td>
                <div class="action-buttons">
                  <button class="action-btn edit-btn" [routerLink]="['/blog', blog.code]" title="Chỉnh sửa">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="action-btn delete-btn" title="Xóa">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </ng-container>

          <!-- PAGINATION -->
          <ng-container table-pagination>
            <button (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
            <button *ngFor="let page of pages" (click)="goToPage(page)" [class.active]="page === currentPage">
              {{ page }}
            </button>
            <button (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
          </ng-container>

        </app-table>

      </div>
    </div>
  </div>
</section>
