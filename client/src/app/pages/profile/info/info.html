<section>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <div class="account-page">

          <h2 class="page-title">Tài khoản cá nhân</h2>

          <div class="account-card" *ngIf="userInfo">
            <!-- TOP INFO -->
            <div class="account-top">
              <div class="user-info">
                <div class="avatar-wrapper">
                  <img class="avatar" [src]="getAvatarUrl(userInfo.Anh_dai_dien)" (error)="onAvatarError($event)" alt="User Avatar">
                  <label class="avatar-upload" *ngIf="isEditing">
                    <i class="bi bi-camera-fill"></i>
                    <input type="file" accept="image/*" (change)="onAvatarSelected($event)" hidden>
                  </label>
                </div>
                <div>
                  <div class="user-name">{{ userInfo.Ho_va_ten }}</div>
                  <div class="user-email">{{ userInfo.Email }}</div>
                </div>
              </div>

              <button class="btn-brown btn-update" (click)="toggleEdit()" [disabled]="isSaving">
                {{ isSaving ? 'Đang lưu...' : (isEditing ? 'Lưu thông tin' : 'Cập nhật thông tin') }}
              </button>
            </div>

            <!-- FORM -->
            <div class="account-form">
              <div class="form-group full">
                <label>Họ tên</label>
                <div class="input-wrapper">
                  <input type="text" [(ngModel)]="userInfo.Ho_va_ten" [disabled]="!isEditing" />
                  <i class="bi bi-x-circle" *ngIf="isEditing"></i>
                </div>
              </div>

              <!-- <div class="form-group">
                <label>Giới tính</label>
                <div class="radio-group">
                  <label><input type="radio" name="gender" [value]="'Nam'" [(ngModel)]="userInfo.Ma_khach_hang" [disabled]="!isEditing" /> Nam</label>
                  <label><input type="radio" name="gender" [value]="'Nữ'" [(ngModel)]="userInfo.Ma_khach_hang" [disabled]="!isEditing" /> Nữ</label>
                  <label><input type="radio" name="gender" [value]="'Khác'" [(ngModel)]="userInfo.Ma_khach_hang" [disabled]="!isEditing" /> Khác</label>
                </div>
              </div>

              <div class="form-group">
                <label>Ngày sinh</label>
                <div class="input-wrapper">
                  <input type="date" [(ngModel)]="userInfo.Ma_khach_hang" [disabled]="!isEditing" />
                  <i class="bi bi-pencil" *ngIf="isEditing"></i>
                </div>
              </div> -->

              <div class="form-group">
                <label>Số điện thoại</label>
                <div class="input-wrapper">
                  <input type="text" [(ngModel)]="userInfo.So_dien_thoai" [disabled]="!isEditing" />
                </div>
              </div>

              <div class="form-group">
                <label>Email *</label>
                <div class="input-wrapper">
                  <input type="email" [(ngModel)]="userInfo.Email" disabled />
                </div>
              </div>

              <div class="form-group full">
                <label>Mật khẩu *</label>
                <div class="password-field">
                  <input [type]="showPassword ? 'text' : 'password'" value="••••••••" disabled />
                  <!-- <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword" (click)="togglePassword()"></i> -->
                </div>
                <a class="change-password add-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#changePasswordModal">
                  Thay đổi mật khẩu
                </a>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>
</section>

<!-- TOAST NOTIFICATION -->
<div *ngIf="showToast" class="info-toast" [class.toast-error]="toastType === 'error'">
  {{ toastMessage }}
</div>

<!-- CHANGE PASSWORD MODAL -->
<app-modal
  modalId="changePasswordModal"
  title="Thay đổi mật khẩu"
  [showHeader]="true"
  [showTitleAndLine]="true"
  [showCloseButton]="true">
  <app-change-password-modal></app-change-password-modal>
</app-modal>
