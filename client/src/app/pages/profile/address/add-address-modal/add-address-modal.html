<form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="add-address-form">

  <!-- SECTION 1: THÔNG TIN CÁ NHÂN -->
  <div class="form-section">
    <div class="section-title">
      <i class="bi bi-person"></i>
      <span>Thông tin cá nhân</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Họ và tên <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="fullName"
            placeholder="Fiona" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('fullName')?.value"></i>
        </div>
      </div>

      <div class="form-group">
        <label>Số điện thoại <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="phone"
            placeholder="0987654321" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('phone')?.value"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- SECTION 2: ĐỊA CHỈ NHẬN HÀNG -->
  <div class="form-section">
    <div class="section-title">
      <i class="bi bi-geo-alt"></i>
      <span>Địa chỉ nhận hàng</span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Tỉnh/Thành phố <span class="required">*</span></label>
        <select formControlName="province" class="form-select">
          <option value="">Thành phố Hồ Chí Minh</option>
          <option *ngFor="let p of provinces" value="{{ p.id }}">{{ p.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quận/Huyện <span class="required">*</span></label>
        <select formControlName="district" class="form-select">
          <option value="">Quận 2</option>
          <option *ngFor="let d of districts" value="{{ d.id }}">{{ d.name }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phường/Xã <span class="required">*</span></label>
        <select formControlName="ward" class="form-select">
          <option value="">Phường 2</option>
          <option *ngFor="let w of wards" value="{{ w.id }}">{{ w.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Địa chỉ cụ thể <span class="required">*</span></label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="address"
            placeholder="222222" />
          <i class="bi bi-x-circle" *ngIf="addressForm.get('address')?.value"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- CHECKBOX -->
  <div class="form-checkbox">
    <input
      type="checkbox"
      id="isDefault"
      formControlName="isDefault" />
    <label for="isDefault">Đặt làm địa chỉ mặc định</label>
  </div>

  <!-- BUTTON -->
  <button
    type="submit"
    class="btn-submit"
    [disabled]="addressForm.invalid">
    Hoàn thành
  </button>

</form>
