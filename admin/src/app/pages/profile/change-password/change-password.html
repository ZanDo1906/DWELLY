<form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="change-password-form">

  <!-- Mật khẩu hiện tại -->
  <div class="form-group">
    <label>Mật khẩu hiện tại <span class="required">*</span></label>
    <div class="input-wrapper">
      <input 
        [type]="showCurrentPassword ? 'text' : 'password'"
        formControlName="currentPassword"
        placeholder="Nhập mật khẩu hiện tại" />
      <i class="bi" 
         [ngClass]="showCurrentPassword ? 'bi-eye' : 'bi-eye-slash'"
         (click)="toggleCurrentPassword()"></i>
    </div>
    <small class="text-danger" *ngIf="changePasswordForm.get('currentPassword')?.touched && changePasswordForm.get('currentPassword')?.errors?.['required']">
      Vui lòng nhập mật khẩu hiện tại
    </small>
  </div>

  <!-- Mật khẩu mới -->
  <div class="form-group">
    <label>Mật khẩu mới <span class="required">*</span></label>
    <div class="input-wrapper">
      <input 
        [type]="showNewPassword ? 'text' : 'password'"
        formControlName="newPassword"
        placeholder="Nhập mật khẩu mới" />
      <i class="bi" 
         [ngClass]="showNewPassword ? 'bi-eye' : 'bi-eye-slash'"
         (click)="toggleNewPassword()"></i>
    </div>
    <small class="text-danger" *ngIf="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.errors?.['required']">
      Vui lòng nhập mật khẩu mới
    </small>
    <small class="text-danger" *ngIf="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.errors?.['minlength']">
      Mật khẩu mới phải có ít nhất 6 ký tự
    </small>
  </div>

  <!-- Xác nhận mật khẩu -->
  <div class="form-group">
    <label>Xác nhận mật khẩu mới <span class="required">*</span></label>
    <div class="input-wrapper">
      <input 
        [type]="showConfirmPassword ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Nhập lại mật khẩu mới" />
      <i class="bi" 
         [ngClass]="showConfirmPassword ? 'bi-eye' : 'bi-eye-slash'"
         (click)="toggleConfirmPassword()"></i>
    </div>
    <small class="text-danger" *ngIf="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.errors?.['required']">
      Vui lòng xác nhận mật khẩu mới
    </small>
    <small class="text-danger" *ngIf="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.errors?.['passwordMisMatch']">
      Mật khẩu xác nhận không khớp
    </small>
  </div>

  <div class="text-danger" *ngIf="formError">{{ formError }}</div>

  <!-- Button -->
  <button 
    type="submit"
    class="btn-save"
    [disabled]="changePasswordForm.invalid || isSubmitting">
    {{ isSubmitting ? 'Đang xử lý...' : 'Lưu thay đổi' }}
  </button>

</form>
