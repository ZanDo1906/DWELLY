<section>
  <div class="container-fluid py-4">
    <div class="padding-x">
      <div class="site-inner products-form-page">

        <!-- HEADER -->
        <div class="page-header">
          <h2 class="page-title">Quản lý sản phẩm</h2>
        </div>

        <!-- BREADCRUMB -->
        <nav class="breadcrumb">
        <ol>
            <li><a routerLink="/product-list">Quản lý sản phẩm</a></li>
            <li *ngIf="!product.Ma_san_pham">Thêm sản phẩm mới</li>
            <li *ngIf="product.Ma_san_pham">Chi tiết sản phẩm</li>
        </ol>
        </nav>

        <!-- Card duy nhất -->
        <div class="form-card">

          <!-- Thông tin chung -->
          <div class="form-section">
            <h4 class="section-title">Thông tin chung</h4>
            <div class="form-row">
              <div class="form-group">
                <label>Mã sản phẩm</label>
                <input type="text" placeholder="Nhập mã sản phẩm" [(ngModel)]="product.Ma_san_pham" required />
              </div>
              <div class="form-group">
                <label>Tên sản phẩm</label>
                <input type="text" placeholder="Nhập tên sản phẩm" [(ngModel)]="product.Ten_san_pham" required />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Giá bán</label>
                <input type="number" placeholder="Nhập giá bán" [(ngModel)]="product.Gia_ban" required />
              </div>
              <div class="form-group">
                <label>Tồn kho</label>
                <input type="number" placeholder="Nhập số lượng tồn kho" [(ngModel)]="product.So_luong_ton_kho" required />
              </div>
            </div>
          </div>

          <!-- Đặc tính sản phẩm -->
          <div class="form-section">
            <h4 class="section-title">Đặc tính sản phẩm</h4>
            <div class="form-row">
              <div class="form-group">
                <label>Chất liệu</label>
                <input type="text" placeholder="Nhập chất liệu" [(ngModel)]="product.Chat_lieu" />
              </div>
              <div class="form-group">
                <label>Kích thước</label>
                <input type="text" placeholder="Nhập kích thước" [(ngModel)]="product.Kich_thuoc" />
              </div>
            </div>
            <div class="form-group">
              <label>Mô tả chi tiết</label>
              <textarea rows="4" placeholder="Nhập mô tả chi tiết" [(ngModel)]="product.Mo_ta"></textarea>
            </div>
          </div>

          <!-- Phân loại sản phẩm -->
          <div class="form-section">
            <h4 class="section-title">Phân loại sản phẩm</h4>
            <div class="form-row">
              <div class="form-group">
                <label>Mã danh mục</label>
                <input type="text" placeholder="Nhập mã danh mục" [(ngModel)]="product.Ma_danh_muc" />
              </div>
              <div class="form-group">
                <label>Mã loại phòng</label>
                <input type="text" placeholder="Nhập mã loại phòng" [(ngModel)]="product.Ma_loai_phong" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Mã phong cách</label>
                <input type="text" placeholder="Nhập mã phong cách" [(ngModel)]="product.Ma_phong_cach" />
              </div>
              <div class="form-group">
                <label>Mã không gian</label>
                <input type="text" placeholder="Nhập mã không gian" [(ngModel)]="product.Ma_khong_gian" />
              </div>
            </div>
          </div>

          <!-- Hình minh họa -->
            <div class="form-section">
            <h4 class="section-title">Hình minh họa</h4>
            <div class="image-upload-grid">
                <div *ngFor="let img of images; let i = index" 
                    class="image-placeholder"
                    [style.backgroundImage]="img ? 'url(' + img + ')' : ''"
                    (click)="triggerFileInput(i)">
                <span *ngIf="!img">+</span>
                <input #fileInput type="file" accept="image/*" hidden 
                        (change)="previewImage($event, i)" />
                </div>
            </div>
            </div>


            <!-- Nút hành động -->
            <div class="form-actions">
                <button class="btn-cancel" (click)="cancelForm()">Hủy</button>
                <button class="btn-save" (click)="saveProduct()">Lưu sản phẩm</button>
                <button class="btn-draft" (click)="saveDraft()">Lưu nháp</button>
                </div>

        </div>

      </div>
    </div>
  </div>
</section>
