<div class="login-page">
  <div class="login-background"></div>
  
  <div class="login-container">
    <div class="login-box">
      
      <form [formGroup]="loginForm" (ngSubmit)="submit()">

        <div class="text-center text-uppercase title-login">
          ĐĂNG NHẬP
        </div>

        <p class="text-center login-subtitle">
          Chào mừng bạn quay trở lại!
        </p>

        <!-- Email -->
        <div class="mb-3">
          <label>Email</label>
          <div class="input-pos-wrapper">
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="admin@dwelly.com"
              [class.is-invalid]="email.invalid && (email.touched || email.dirty)">
            
            <div class="icon-group">
              <i class="bi bi-exclamation-circle error-icon-fixed" 
                *ngIf="email.invalid && (email.touched || email.dirty)">
              </i>
            </div>
          </div>

          <div class="error-area" *ngIf="email.invalid && (email.touched || email.dirty)">
            <small class="text-danger" *ngIf="email.errors?.['required']">
              Email không được để trống
            </small>
            <small class="text-danger" *ngIf="email.errors?.['email']">
              Email không hợp lệ
            </small>
          </div>
        </div>

        <!-- Mật khẩu -->
        <div class="mb-3">
          <label>Mật khẩu</label>
          <div class="input-pos-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-control"
              formControlName="password"
              placeholder="Value"
              [class.is-invalid]="password.invalid && (password.touched || password.dirty)">
            
            <div class="icon-group">
              <i class="bi bi-exclamation-circle error-icon-fixed" 
                *ngIf="!loginForm.get('password')?.value && (password.touched || password.dirty)">
              </i>
              
              <i class="bi" 
                *ngIf="loginForm.get('password')?.value"
                [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'" 
                (click)="togglePassword()">
              </i>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-start">
            <div class="error-area">
              <div *ngIf="password.invalid && (password.touched || password.dirty)">
              
                <small class="text-danger" *ngIf="password.errors?.['required']">
                  Mật khẩu không được để trống
                </small>
                
                <small class="text-danger" *ngIf="password.errors?.['minlength']">
                  Mật khẩu tối thiểu 6 ký tự
                </small>

              </div>
            </div>
            
            <a routerLink="/forgot-password" class="forgot-password">
              Quên mật khẩu?
            </a>
          </div>
        </div>

        <!-- Remember me -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}">
          <label class="form-check-label" for="rememberMe">
            Ghi nhớ cho lần đăng nhập sau
          </label>
        </div>

        <button
          type="submit"
          class="btn btn-login w-100"
          [disabled]="loginForm.invalid">
          Đăng nhập
        </button>

        <div class="text-danger text-center mt-3" *ngIf="loginError">
          {{ loginError }}
        </div>

      </form>
    </div>
  </div>
</div>
