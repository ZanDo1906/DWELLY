<!-- Login Alert Content -->
<div class="login-alert-content">
    <!-- Body -->
    <div class="popup-body">
        <h2 class="popup-title">Bạn chưa đăng nhập !</h2>
        <p class="main-text">
            Đăng nhập hoặc đăng ký tài khoản
            <strong>DWELLY</strong> để nhận ưu đãi, lưu thông tin mua hàng
            và theo dõi đơn hàng dễ dàng hơn.
        </p>

        <p class="sub-text">
            Bạn vẫn có thể tiếp tục mua hàng ngay mà không cần đăng nhập.
        </p>
    </div>

    <!-- Actions -->
    <div class="popup-actions">
        <div class="auth-buttons">
            <button type="button" class="btn-outline" data-bs-toggle="modal" data-bs-target="#loginModal"
                (click)="closeAlert()">
                Đăng nhập
            </button>
            <button type="button" class="btn-outline" data-bs-toggle="modal" data-bs-target="#registerModal"
                (click)="closeAlert()">
                Đăng ký
            </button>
        </div>

        <button class="btn-primary" (click)="continueShopping()">Tiếp tục mua hàng</button>
    </div>
</div>
