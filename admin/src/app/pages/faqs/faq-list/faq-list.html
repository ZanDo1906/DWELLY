<section>
    <div class="container-fluid py-4">
        <div class="padding-x">
            <div class="site-inner faq-page orders-page">
                <div class="page-header">
                    <h2 class="page-title">Quản lý FAQs</h2>
                </div>

                <div class="filter-bar">
                    <div class="search-wrapper">
                        <div class="search-container">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" class="search-input" [value]="searchText"
                                (input)="onSearchChange($event)" placeholder="Tìm kiếm" />
                        </div>
                    </div>

                    <div class="filter-group">
                        <button class="filter-btn" [class.active]="sortType === 'az'" (click)="setSortType('az')">
                            A-Z
                        </button>

                        <button class="filter-btn" [class.active]="sortType === 'newest'"
                            (click)="setSortType('newest')">
                            Mới nhất
                        </button>

                        <button class="filter-btn" [class.active]="sortType === 'oldest'"
                            (click)="setSortType('oldest')">
                            Cũ nhất
                        </button>

                        <div class="dropdown-wrapper">
                            <div class="dropdown-selected" (click)="toggleStatusDropdown($event)">
                                {{ selectedStatusLabel }}
                                <i class="bi bi-chevron-down dropdown-icon" [class.rotate]="isStatusOpen"></i>
                            </div>
                            <div class="dropdown-menu" *ngIf="isStatusOpen">
                                <div class="dropdown-item" *ngFor="let status of statusOptions"
                                    (click)="selectStatus(status.value)">
                                    {{ status.label }}
                                </div>
                            </div>
                        </div>
                        <button class="delete-btn" [disabled]="!selectedCount" (click)="deleteSelected()">
                            <i class="bi bi-trash"></i>
                        </button>

                    </div>
                </div>

                <app-table>
                    <ng-container table-header>
                        <th>
                            <input type="checkbox" [checked]="isPageFullySelected"
                                (change)="toggleSelectPage($event)" />
                        </th>
                        <th>Mã câu hỏi</th>
                        <th>Tên khách hàng</th>
                        <th>Thời gian gửi</th>
                        <th>Nội dung câu hỏi</th>
                        <th>Trạng thái</th>
                        <th>Người xử lý</th>
                        <th>Hành động</th>
                    </ng-container>

                    <ng-container table-body>
                        <tr *ngFor="let faq of pagedFaqs">
                            <td>
                                <input type="checkbox" [checked]="selectedIds.has(faq.id)"
                                    (change)="toggleSelectRow(faq.id, $event)" />
                            </td>
                            <td>{{ faq.questionCode }}</td>
                            <td>{{ faq.customerName }}</td>
                            <td>{{ faq.submittedAt }}</td>
                            <td class="question-content">{{ faq.questionContent }}</td>
                            <td>
                                <span class="status approval-status" [ngClass]="faq.status">{{ faq.statusLabel }}</span>
                            </td>
                            <td>{{ faq.handler }}</td>
                            <td>
                                <div class="action-group">
                                    <button class="action-btn edit-btn" (click)="editFaq(faq.id)" title="Sửa"
                                        data-bs-toggle="modal" data-bs-target="#faqAnswerModal">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="action-btn delete-btn" (click)="deleteFaq(faq.id)" title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </ng-container>

                    <ng-container table-pagination>
                        <button (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
                        <button *ngFor="let page of pages" (click)="goToPage(page)"
                            [class.active]="page === currentPage">
                            {{ page }}
                        </button>
                        <button (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
                    </ng-container>
                </app-table>

                <app-modal modalId="faqAnswerModal" [title]="faqModalTitle">
                    <app-faq-form [faq]="selectedFaq" (saveDraft)="onSaveDraft($event)"
                        (sendAnswer)="onSendAnswer($event)">
                    </app-faq-form>
                </app-modal>

                <app-confirm-dialog *ngIf="showDeleteConfirm" modalId="faqDeleteConfirmModal" title="Xác nhận xóa"
                    [message]="deleteConfirmMessage" (confirm)="confirmDelete()" (cancel)="cancelDelete()">
                </app-confirm-dialog>
            </div>
        </div>
    </div>
</section>
