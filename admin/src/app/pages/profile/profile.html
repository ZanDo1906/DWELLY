<section>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <div class="account-page">

          <h2 class="page-title">Tài khoản cá nhân</h2>

          <div class="account-card" *ngIf="adminInfo">
            <!-- TOP INFO -->
            <div class="account-top">
              <div class="user-info">
                <div class="avatar-wrapper">
                  <img class="avatar" [src]="getAdminAvatarUrl()" alt="Admin Avatar" (error)="onImageError($event)">
                </div>
                <div>
                  <div class="user-name">{{ adminInfo.Ho_va_ten || 'Admin' }}</div>
                  <div class="user-email">{{ adminInfo.Email || 'admin@dwelly.com' }}</div>
                </div>
              </div>
            </div>

            <!-- FORM -->
            <div class="account-form">
              <div class="form-group full">
                <label>Họ tên</label>
                <div class="input-wrapper">
                  <input type="text" [value]="adminInfo.Ho_va_ten || ''" disabled />
                </div>
              </div>

              <div class="form-group">
                <label>Số điện thoại</label>
                <div class="input-wrapper">
                  <input type="text" [value]="adminInfo.So_dien_thoai || ''" disabled />
                </div>
              </div>

              <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                  <input type="email" [value]="adminInfo.Email || ''" disabled />
                </div>
              </div>

              <div class="form-group full">
                <label>Mật khẩu</label>
                <div class="password-field">
                  <input [value]="password" [type]="showPassword ? 'text' : 'password'" disabled />
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'" (click)="togglePassword()"></i>
                </div>
                <a class="change-password"
                  data-bs-toggle="modal"
                  data-bs-target="#changePasswordModal">
                  Thay đổi mật khẩu
                </a>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>
</section>


<app-modal
  modalId="changePasswordModal"
  title="Thay đổi mật khẩu"
  [showHeader]="true">
  <app-change-password></app-change-password>
</app-modal>
