<div class="container">

  <!-- LEFT -->
  <div class="left">
    <h2>Trải nghiệm không gian</h2>

    <!-- Upload -->
    <div class="upload-box">
      <input type="file" (change)="onUpload($event)" />
      <p>Upload ảnh phòng</p>
    </div>

    <!-- Preview -->
    <div *ngIf="imagePreview">
      <img [src]="imagePreview" class="main-img"/>
    </div>

    <!-- Result -->
    <div *ngIf="resultImage">
      <img [src]="resultImage" class="main-img"/>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <h3>Chọn sản phẩm</h3>

    <!-- SEARCH -->
    <input
      class="search"
      placeholder="Tìm nội thất..."
      [(ngModel)]="search"
      (input)="onFilterChange()"
    />

    <!-- FILTER ROOM -->
    <div class="filter">
      <button (click)="selectedRoom='all'; onFilterChange()">Tất cả</button>
      <button (click)="selectedRoom='living'; onFilterChange()">Phòng khách</button>
      <button (click)="selectedRoom='bedroom'; onFilterChange()">Phòng ngủ</button>
      <button (click)="selectedRoom='work'; onFilterChange()">Làm việc</button>
    </div>

    <!-- FILTER STYLE -->
    <div class="filter">
      <button (click)="selectedStyle='all'; onFilterChange()">Tất cả</button>
      <button (click)="selectedStyle='modern'; onFilterChange()">Modern</button>
      <button (click)="selectedStyle='minimal'; onFilterChange()">Minimal</button>
      <button (click)="selectedStyle='japandi'; onFilterChange()">Japandi</button>
    </div>

    <!-- LIST -->
    <div class="product-list">
      <p *ngIf="loadingProducts">Đang tải sản phẩm...</p>
      <p *ngIf="!loadingProducts && productError">{{ productError }}</p>
      <p *ngIf="!loadingProducts && !productError && products.length === 0">Không có sản phẩm phù hợp.</p>

      <div
        class="product-card"
        *ngFor="let p of products"
        [class.active]="isSelected(p)"
        (click)="toggleProduct(p)"
      >
        <img [src]="p.image" />

        <div class="info">
          <h4>{{ p.name }}</h4>
          <p>{{ p.price | number }}đ</p>
        </div>
      </div>
    </div>

    <!-- ACTION -->
    <div class="bottom">
      <p>Đã chọn {{ selectedProducts.length }} sản phẩm</p> 

      <button (click)="generateAI()" [disabled]="loading">
        {{ loading ? 'Đang tạo...' : 'Tạo hình ảnh không gian' }}
      </button> 
    </div>

  </div>
</div>
