<div class="m-3 p-3">
    <div class="row">
        <div class="col-md-6">
            <div class="border p-3">
                <h3 class="mb-3">Danh sách khách hàng</h3>

                <div class="item {{ isSelectedClient(d) ? 'selected' : '' }}" *ngFor="let d of clientList"
                    (click)="onSelectClient(d)">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>{{ d.Ma_khach_hang }}</strong> - {{ d.Ho_va_ten }}
                        </div>
                        <div class="text-muted">
                            <small>{{ d.Email }}</small>
                        </div>
                    </div>
                    <div class="mt-1">
                        <small>SĐT: {{ d.So_dien_thoai }} | Điểm: {{ d.Tong_diem }}</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="border p-3">
                <h3 class="mb-3">Danh sách quản trị viên</h3>

                <div class="item {{ isSelectedAdmin(d) ? 'selected' : '' }}" *ngFor="let d of adminList"
                    (click)="onSelectAdmin(d)">
                    <div>
                        <strong>{{ d.Ma_quan_tri_vien }}</strong> - {{ d.Ho_va_ten }}
                    </div>
                    <div class="mt-1">
                        <small>Email: {{ d.Email }} | SĐT: {{ d.So_dien_thoai }}</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
