<div class="reset-password-page">
  <div class="reset-background"></div>
  
  <div class="reset-container">
    <div class="reset-box">
      
      <!-- Icon -->
      <div class="icon-wrapper">
        <div class="icon-box">
          <span class="corner top-left"></span>
          <span class="corner top-right"></span>
          <span class="corner bottom-left"></span>
          <span class="corner bottom-right"></span>
          <i class="bi bi-shield-lock"></i>
        </div>
      </div>

      <!-- Title -->
      <h1 class="title">Đặt lại mật khẩu</h1>

      <!-- Error Message -->
      <div class="alert alert-danger" *ngIf="errorMessage" style="margin-bottom: 20px; padding: 10px 14px; border-radius: 8px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
        {{ errorMessage }}
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        
        <!-- Description -->
        <p class="description">
          Vui lòng nhập mật khẩu mới của bạn
        </p>

          <!-- Mật khẩu mới -->
        <div class="form-group">
          <label>Mật khẩu mới <span class="required">*</span></label>
          <div class="input-wrapper">
            <input
              [type]="showNewPassword ? 'text' : 'password'"
              class="form-input"
              formControlName="newPassword"
              placeholder=""
              [class.error]="newPassword.invalid && (newPassword.touched || newPassword.dirty)">
            
            <i class="bi toggle-icon" 
              *ngIf="resetForm.get('newPassword')?.value"
              [ngClass]="showNewPassword ? 'bi-eye' : 'bi-eye-slash'" 
              (click)="showNewPassword = !showNewPassword">
            </i>
          </div>
          <!-- Real-time validation: show error immediately when typing -->
          <p class="field-error" *ngIf="newPassword.value && newPassword.invalid">
            <span *ngIf="newPassword.errors?.['required']">Mật khẩu mới không được để trống</span>
            <span *ngIf="newPassword.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự</span>
          </p>
        </div>

        <!-- Xác nhận mật khẩu -->
        <div class="form-group">
          <label>Xác nhận mật khẩu <span class="required">*</span></label>
          <div class="input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-input"
              formControlName="confirmPassword"
              placeholder=""
              [class.error]="confirmPassword.invalid && (confirmPassword.touched || confirmPassword.dirty)">
            
            <i class="bi toggle-icon" 
              *ngIf="resetForm.get('confirmPassword')?.value"
              [ngClass]="showConfirmPassword ? 'bi-eye' : 'bi-eye-slash'" 
              (click)="showConfirmPassword = !showConfirmPassword">
            </i>
          </div>
          <p class="field-error" *ngIf="confirmPassword.invalid && (confirmPassword.touched || confirmPassword.dirty)">
            <span *ngIf="confirmPassword.errors?.['required']">Vui lòng xác nhận mật khẩu</span>
            <span *ngIf="confirmPassword.errors?.['mismatch']">Mật khẩu không khớp</span>
          </p>
        </div>

        <!-- Button -->
        <button 
          type="submit"
          class="btn-submit" 
          [disabled]="resetForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Đang xử lý...' : 'Xác nhận' }}
        </button>

        <div class="text-success text-center mt-3" *ngIf="successMessage">
          {{ successMessage }}
        </div>

      </form>

      <!-- Back to Login -->
      <div class="text-center mt-4">
        <a routerLink="/login" class="back-link">
          <i class="bi bi-arrow-left"></i>
          Quay lại đăng nhập
        </a>
      </div>

    </div>
  </div>
</div>
