<div class="form">
  
  <form [formGroup]="loginForm" (ngSubmit)="submit()">

    <div class="text-center text-uppercase title-register">
      Đăng nhập
    </div>

    <p class="text-center register-subtitle">
      Chào mừng bạn quay trở lại!
    </p>

    <!-- Email -->
    <div class="mb-3">
      <label>Email</label>
      <div class="input-pos-wrapper">
        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Nhập email"
          [class.is-invalid]="email.invalid && (email.touched || email.dirty)">
        
        <div class="icon-group">
          <i class="bi bi-exclamation-circle error-icon-fixed" 
            *ngIf="email.invalid && (email.touched || email.dirty)">
          </i>
        </div>
      </div>

      <div class="error-area" *ngIf="email.invalid && (email.touched || email.dirty)">
        <small class="text-danger" *ngIf="email.errors?.['required']">
          Email không được để trống
        </small>
        <small class="text-danger" *ngIf="email.errors?.['email']">
          Email không hợp lệ
        </small>
      </div>
    </div>
    <!-- Mật khẩu -->
    <div class="mb-3">
      <label>Mật khẩu</label>
      <div class="input-pos-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
          placeholder="Nhập mật khẩu"
          [class.is-invalid]="password.invalid && (password.touched || password.dirty)">
        
        <div class="icon-group">
          <i class="bi bi-exclamation-circle error-icon-fixed" 
            *ngIf="!loginForm.get('password')?.value && (password.touched || password.dirty)">
          </i>
          
          <i class="bi" 
            *ngIf="loginForm.get('password')?.value"
            [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'" 
            (click)="togglePassword()">
          </i>
        </div>
      </div>

  <div class="d-flex justify-content-between align-items-start">
    <div class="error-area">
      <div *ngIf="password.invalid && (password.touched || password.dirty)">
      
      <small class="text-danger" *ngIf="password.errors?.['required']">
        Mật khẩu không được để trống
      </small>
      
      <small class="text-danger" *ngIf="password.errors?.['minlength']">
        Mật khẩu tối thiểu 6 ký tự
      </small>

    </div>
    </div>
    
    <a href="javascript:void(0)" 
       class="forgot-password" 
       data-bs-toggle="modal" 
       data-bs-target="#forgotPasswordModal">
       Quên mật khẩu?
    </a>
  </div>
</div>

      <button
  type="submit"
  class="btn btn-login"
  [disabled]="loginForm.invalid">

  <i class="bi bi-arrow-right"></i>
  <span>Đăng nhập</span>

</button>

<div class="text-danger text-center mt-2" *ngIf="loginError">
  {{ loginError }}
</div>
<!-- divider -->
<div class="login-divider">
  <span>Hoặc đăng nhập với</span>
</div>

<!-- nút fb gg -->
<div class="d-flex gap-3 justify-content-center mt-3">
  <button class="btn btn-outline-secondary social-btn">
  <img src="assets/images/icon/Facebook_Logo.png" class="social-icon" alt="Facebook logo">
  Facebook
</button>

<button class="btn btn-outline-secondary social-btn">
  <img src="assets/images/icon/Google__G__logo.svg.webp" class="social-icon" alt="Google logo">
  Google
</button>
</div>

<div class="text-bottom mt-3 text-center">
  Bạn chưa có tài khoản?
  <a class="register-link"
    href="javascript:void(0)"
    data-bs-toggle="modal"
    data-bs-target="#registerModal">
    Đăng ký ngay
  </a>
</div>

  </form>

</div>
