<!-- Single Product Info -->
<div class="review-products-list">
	<div class="review-product-info-item" style="background: none; padding: 0;">
		<div class="review-product-image">
			<img [src]="imgSrc || 'assets/images/placeholder.png'" [alt]="productName" class="img-thumbnail" />
		</div>
		<div class="review-product-text justify-content-center">
			<p><strong>{{ productName }}</strong></p>
			<p><span>Số lượng: {{ quantity }}</span></p>
		</div>
	</div>
	<hr/>
</div>

<!-- Rating Selection -->
<div class="review-rating-section">
	<label>Cấp độ đánh giá <span class="text-danger">*</span></label>
	<div class="rating-stars-select">
		<span
			*ngFor="let i of [1, 2, 3, 4, 5]"
			class="rating-star"
			[ngClass]="(hoveringRating || reviewRating) >= i ? 'filled' : ''"
			(click)="setReviewRating.emit(i)"
			(mouseenter)="hoveringRatingChange.emit(i)"
			(mouseleave)="hoveringRatingChange.emit(0)">
			<i class="bi" [ngClass]="(hoveringRating || reviewRating) >= i ? 'bi-star-fill' : 'bi-star'"></i>
		</span>
	</div>
</div>

<!-- Add Images Section -->
<div class="review-images-section">
	<label>Thêm hình ảnh (tối đa 5)</label>
	<div class="images-grid">
		<div *ngFor="let i of [0, 1, 2, 3, 4]" class="image-upload-box">
			<input
				type="file"
				accept="image/*"
				(change)="onImageSelected($event, i)"
				#imageInput />
			<div class="image-preview" *ngIf="reviewImages[i]" (click)="imageInput.click()">
				<img [src]="reviewImages[i]" alt="preview" />
				<button type="button" class="remove-image-btn" (click)="$event.stopPropagation(); removeImage.emit(i)">
					<i class="bi bi-x"></i>
				</button>
			</div>
			<div class="upload-placeholder" *ngIf="!reviewImages[i]" (click)="imageInput.click()">
				<i class="bi bi-plus"></i>
			</div>
		</div>
	</div>
</div>

<!-- Review Content -->
<div class="review-content-section">
	<label>Nhận xét của bạn <span class="text-danger">*</span></label>
	<div class="textarea-wrapper">
		<textarea
			class="review-textarea"
			[(ngModel)]="reviewContent"
			(ngModelChange)="reviewContentChange.emit($event)"
			maxlength="500"
			placeholder="Chia sẻ trải nghiệm của bạn về các sản phẩm này...">
		</textarea>
		<div class="char-counter">{{ reviewContent.length }}/500</div>
	</div>
</div>

<!-- Modal Footer -->
<div class="modal-footer">
	<button class="btn btn-secondary" (click)="cancel.emit()">Quay lại</button>
	<button 
		class="btn btn-submit" 
		(click)="submit.emit()"
		[disabled]="isSubmitting">
		{{ isSubmitting ? 'Đang gửi...' : 'Gửi đánh giá' }}
	</button>
</div>
