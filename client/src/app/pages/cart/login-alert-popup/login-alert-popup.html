<div class="overlay">
    <div class="popup">

        <!-- Header -->
        <div class="popup-header">
            <h2>Bạn chưa đăng nhập !</h2>
            <button class="close-btn" (click)="closePopup()" aria-label="Close">×</button>
        </div>

        <!-- Body -->
        <div class="popup-body">
            <p class="main-text">
                Đăng nhập hoặc đăng ký tài khoản
                <strong>DWELLY</strong> để nhận ưu đãi, lưu thông tin mua hàng
                và theo dõi đơn hàng dễ dàng hơn.
            </p>

            <p class="sub-text">
                Bạn vẫn có thể tiếp tục mua hàng ngay mà không cần đăng nhập.
            </p>
        </div>

        <!-- Actions -->
        <div class="popup-actions">
            <div class="auth-buttons">
                <button
                    type="button"
                    class="btn-outline"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    (click)="closePopup()"
                >
                    Đăng nhập
                </button>
                <button
                    type="button"
                    class="btn-outline"
                    data-bs-toggle="modal"
                    data-bs-target="#registerModal"
                    (click)="closePopup()"
                >
                    Đăng ký
                </button>
            </div>

            <button class="btn-primary" (click)="continueShopping()">Tiếp tục mua hàng</button>
        </div>

    </div>
</div>
