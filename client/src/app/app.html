<h3 class="bg-primary text-center text-white p-3">ANGULAR ROUTING</h3>
<!-- A grey horizontal navbar that becomes vertical on small screens -->
<nav class="navbar navbar-expand-sm bg-light">

  <div class="container-fluid">
    <!-- Links -->
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" routerLink="/test" routerLinkActive="active">Test</a>
      </li>
    </ul>
  </div>
  <button
      class="btn btn-outline-primary"
      data-bs-toggle="modal"
      data-bs-target="#registerModal">
      Đăng ký
  </button>
  <button
      class="btn btn-outline-primary"
      data-bs-toggle="modal"
      data-bs-target="#loginModal">
      Đăng nhập
  </button>

</nav>

<!-- modal -->
<div class="modal fade" id="registerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-body">
        <app-register (close)="closeRegisterModal()"></app-register>
      </div>

    </div>
  </div>
</div>

<!-- modal -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-body">
        <app-login (close)="closeLoginModal()"></app-login>
      </div>

    </div>
  </div>
</div>

<router-outlet></router-outlet>
