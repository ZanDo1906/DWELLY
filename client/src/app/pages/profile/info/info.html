<section>
  <div class="container-fluid py-4">
    <div class="px-4">
      <div class="site-inner">

        <div class="account-page">

          <h2 class="page-title">Tài khoản cá nhân</h2>

          <div class="account-card">
            <!-- TOP INFO -->
            <div class="account-top">
              <div class="user-info">
                <div class="avatar"></div>
                <div>
                  <div class="user-name">Your name</div>
                  <div class="user-email">yourname@gmail.com</div>
                </div>
              </div>

              <button class="btn-brown btn-update" (click)="toggleEdit()">
                {{ isEditing ? 'Lưu thông tin' : 'Cập nhật thông tin' }}
              </button>
            </div>

            <!-- FORM -->
            <div class="account-form">
              <div class="form-group full">
                <label>Họ tên</label>
                <div class="input-wrapper">
                  <input type="text" value="Fiona Nguyen" [disabled]="!isEditing" />
                  <i class="bi bi-x-circle" *ngIf="isEditing"></i>
                </div>
              </div>

              <div class="form-group">
                <label>Giới tính</label>
                <div class="radio-group">
                  <label><input type="radio" name="gender" [disabled]="!isEditing" /> Nam</label>
                  <label><input type="radio" name="gender" [disabled]="!isEditing" /> Nữ</label>
                  <label><input type="radio" name="gender" [disabled]="!isEditing" /> Khác</label>
                </div>
              </div>

              <div class="form-group">
                <label>Ngày sinh</label>
                <div class="input-wrapper">
                  <input type="date" [disabled]="!isEditing" />
                  <i class="bi bi-pencil" *ngIf="isEditing"></i>
                </div>
              </div>

              <div class="form-group">
                <label>Số điện thoại *</label>
                <div class="input-wrapper">
                  <input type="text" value="0987654321" disabled />
                </div>
              </div>

              <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                  <input type="email" placeholder="Nhập email" [disabled]="!isEditing" />
                  <i class="bi bi-pencil" *ngIf="isEditing"></i>
                </div>
              </div>

              <div class="form-group full">
                <label>Mật khẩu *</label>
                <div class="password-field">
                  <input type="password" value="password" disabled />
                  <i class="bi bi-eye"></i>
                </div>
                <a class="change-password add-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#changePasswordModal">
                  Thay đổi mật khẩu
                </a>
              </div>
            </div>

          </div>

        </div>

      </div>
    </div>
  </div>
</section>

<!-- CHANGE PASSWORD MODAL -->
<app-modal
  modalId="changePasswordModal"
  title="Thay đổi mật khẩu"
  [showHeader]="true"
  [showTitleAndLine]="true"
  [showCloseButton]="true">
  <app-change-password-modal></app-change-password-modal>
</app-modal>
